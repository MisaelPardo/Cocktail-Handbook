name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1. Primeiro compila o APK para gerar a debug.keystore automaticamente
      - name: Build APK
        run: flutter build apk --release

      # 2. Depois roda o relatório para extrair o SHA-1 sem dar Missing Keystore
      - name: Get SHA-1 certificate
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew signingReport

      # 3. Faz o upload do APK para download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
